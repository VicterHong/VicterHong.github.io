<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <linearGradient id="videoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1f"/>
      <stop offset="100%" stop-color="#0d0d0f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5c542"/>
      <stop offset="100%" stop-color="#f7d77a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1440" height="900" fill="#0a0a0b"/>

  <!-- Grid pattern -->
  <g opacity="0.03" stroke="#ffffff" stroke-width="1">
    <path d="M0 100 H1440 M0 200 H1440 M0 300 H1440 M0 400 H1440 M0 500 H1440 M0 600 H1440 M0 700 H1440 M0 800 H1440"/>
    <path d="M100 0 V900 M200 0 V900 M300 0 V900 M400 0 V900 M500 0 V900 M600 0 V900 M700 0 V900 M800 0 V900 M900 0 V900 M1000 0 V900 M1100 0 V900 M1200 0 V900 M1300 0 V900 M1400 0 V900"/>
  </g>

  <!-- Header -->
  <g transform="translate(80, 60)">
    <rect x="0" y="0" width="12" height="12" rx="3" fill="#f5c542" filter="url(#glow)"/>
    <text x="24" y="11" fill="#e8e8ed" font-size="16" font-weight="600">Victer</text>
    <text x="1100" y="11" fill="#8a8a96" font-size="14" text-anchor="end">Proyek</text>
    <text x="1190" y="11" fill="#8a8a96" font-size="14" text-anchor="end">Cara kerja</text>
    <text x="1280" y="11" fill="#8a8a96" font-size="14" text-anchor="end">Kontak</text>
  </g>

  <!-- Video showcase frame (16:9) -->
  <g transform="translate(80, 140)">
    <!-- Frame border with glow -->
    <rect x="-2" y="-2" width="1284" height="724" rx="20" fill="none" stroke="#f5c542" stroke-width="1.5" opacity="0.35"/>
    <rect x="0" y="0" width="1280" height="720" rx="18" fill="url(#videoGrad)"/>

    <!-- Video content placeholder — abstract network visual -->
    <g opacity="0.85">
      <!-- Central glow -->
      <circle cx="640" cy="360" r="180" fill="#f5c542" opacity="0.08" filter="url(#glow)"/>
      <circle cx="640" cy="360" r="90" fill="#f7d77a" opacity="0.12"/>

      <!-- Network nodes -->
      <g stroke="#f5c542" stroke-width="1" opacity="0.5" fill="none">
        <path d="M400 240 L540 320 L640 280 L780 340 L900 260"/>
        <path d="M420 420 L560 380 L680 440 L820 400 L920 460"/>
        <path d="M540 320 L560 380 M640 280 L680 440 M780 340 L820 400"/>
        <path d="M400 240 L420 420 M900 260 L920 460"/>
      </g>
      <g fill="#ffb088">
        <circle cx="400" cy="240" r="4"/><circle cx="540" cy="320" r="5"/>
        <circle cx="640" cy="280" r="6"/><circle cx="780" cy="340" r="5"/>
        <circle cx="900" cy="260" r="4"/><circle cx="420" cy="420" r="4"/>
        <circle cx="560" cy="380" r="5"/><circle cx="680" cy="440" r="6"/>
        <circle cx="820" cy="400" r="5"/><circle cx="920" cy="460" r="4"/>
      </g>

      <!-- Particles -->
      <g fill="#ffffff" opacity="0.25">
        <circle cx="300" cy="180" r="2"/><circle cx="1050" cy="220" r="2.5"/>
        <circle cx="380" cy="560" r="2"/><circle cx="980" cy="580" r="2.5"/>
        <circle cx="200" cy="380" r="1.5"/><circle cx="1120" cy="420" r="1.5"/>
        <circle cx="720" cy="140" r="2"/><circle cx="600" cy="620" r="2"/>
      </g>
    </g>

    <!-- Gradient overlay -->
    <rect x="0" y="360" width="1280" height="360" rx="0" fill="url(#videoGrad)" opacity="0.75"/>
    <rect x="0" y="540" width="1280" height="180" rx="0" fill="#0a0a0b" opacity="0.9"/>
    <rect x="0" y="700" width="1280" height="20" rx="0" fill="#0a0a0b"/>

    <!-- Play button (centered) -->
    <g transform="translate(640, 330)">
      <circle cx="0" cy="0" r="44" fill="#0a0a0b" opacity="0.7"/>
      <circle cx="0" cy="0" r="44" fill="none" stroke="#f5c542" stroke-width="1.5" opacity="0.6"/>
      <path d="M-12 -18 L24 0 L-12 18 Z" fill="#f7d77a"/>
    </g>

    <!-- Video metadata (bottom) -->
    <g transform="translate(60, 600)">
      <text x="0" y="0" fill="#f5c542" font-size="13" font-weight="600" letter-spacing="1.5">VIDEO NARASI</text>
      <text x="0" y="34" fill="#ffffff" font-size="32" font-weight="700">MINA — Arsitektur Sistem</text>
      <text x="0" y="62" fill="#8a8a96" font-size="15">Bagaimana remote control 25 MB RAM dibangun dan diuji</text>
    </g>

    <!-- Duration badge (top-right) -->
    <g transform="translate(1150, 40)">
      <rect x="0" y="0" width="90" height="32" rx="16" fill="#0a0a0b" opacity="0.8"/>
      <rect x="0" y="0" width="90" height="32" rx="16" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.15"/>
      <circle cx="20" cy="16" r="4" fill="#f5c542"/>
      <text x="34" y="21" fill="#e8e8ed" font-size="13" font-weight="500">0:45</text>
    </g>

    <!-- Progress bar -->
    <g transform="translate(0, 718)">
      <rect x="0" y="0" width="1280" height="2" fill="#ffffff" opacity="0.08"/>
      <rect x="0" y="0" width="480" height="2" fill="url(#accentGrad)"/>
      <circle cx="480" cy="1" r="5" fill="#f7d77a" filter="url(#glow)"/>
    </g>
  </g>

  <!-- Caption below -->
  <g transform="translate(80, 890)">
    <text x="0" y="0" fill="#8a8a96" font-size="13">Video narasi per proyek — dihasilkan dengan Seedance (gratis), dirender lokal</text>
  </g>
</svg>
