<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Just a moment...</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #ffffff;
      color: #333;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      line-height: 1.6;
    }
    .container {
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    .logo-text {
      font-size: 2rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 40px;
      letter-spacing: -0.5px;
    }
    .spinner-wrapper {
      margin: 30px 0;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid #e0e0e0;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 16px;
    }
    .description {
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 24px;
      line-height: 1.7;
    }
    .verification-box {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 24px;
      margin: 24px 0;
      border: 1px solid #e9ecef;
    }
    #turnstile-container {
      min-height: 65px;
      display: flex;
      justify-content: center;
      margin: 16px 0;
    }
    .status-text {
      font-size: 0.9rem;
      color: #888;
      margin-top: 12px;
    }
    .ray-id {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #e9ecef;
      font-size: 0.8rem;
      color: #999;
      font-family: 'Courier New', monospace;
    }
    .footer {
      margin-top: 40px;
      font-size: 0.75rem;
      color: #aaa;
    }
    .footer a {
      color: #6366f1;
      text-decoration: none;
    }
    .footer a:hover { text-decoration: underline; }
    .hidden { display: none !important; }
    
    /* Dark mode support */
    @media (prefers-color-scheme: dark) {
      body { background: #0f0f1a; color: #e0e0e0; }
      .logo-text { color: #fff; }
      h1 { color: #fff; }
      .description { color: #aaa; }
      .verification-box { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1); }
      .ray-id { border-color: rgba(255,255,255,0.1); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-text">portfolio-victer.pages.dev</div>
    
    <div class="spinner-wrapper">
      <div class="spinner" id="spinner"></div>
    </div>
    
    <h1 id="mainTitle">Performing security verification</h1>
    
    <p class="description" id="description">
      This website uses a security service to protect against malicious bots. 
      This page is displayed while the website verifies you are not a bot.
    </p>
    
    <div class="verification-box" id="verificationBox">
      <div id="turnstile-container"></div>
      <p class="status-text" id="statusText">Waiting for verification...</p>
    </div>
    
    <div class="ray-id" id="rayId">
      Ray ID: <span id="rayIdValue">-</span>
    </div>
    
    <div class="footer">
      <p>Performance and Security by <a href="https://www.cloudflare.com" target="_blank">Cloudflare</a></p>
      <p style="margin-top:8px;"><a href="#" id="privacyLink">Privacy</a> · <a href="#" id="termsLink">Terms</a></p>
    </div>
  </div>

  <script>
    const TURNSTILE_SITE_KEY = '0x4AAAAAAFMyWUdxNriDmfym';
    const TARGET_URL = './home.html';
    const VERIFY_ENDPOINT = 'https://portfolio-victer.victerphanjaya.workers.dev/api/verify-turnstile';
    
    // Generate Ray ID (seperti Cloudflare)
    function generateRayId() {
      const chars = '0123456789abcdef';
      let id = '';
      for (let i = 0; i < 16; i++) {
        id += chars[Math.floor(Math.random() * chars.length)];
      }
      return id;
    }
    
    document.getElementById('rayIdValue').textContent = generateRayId();
    
    const els = {
      mainTitle: document.getElementById('mainTitle'),
      description: document.getElementById('description'),
      spinner: document.getElementById('spinner'),
      statusText: document.getElementById('statusText'),
      turnstileContainer: document.getElementById('turnstile-container'),
      verificationBox: document.getElementById('verificationBox')
    };
    
    function setStatus(title, desc, status) {
      els.mainTitle.textContent = title;
      els.description.textContent = desc;
      els.statusText.textContent = status;
    }
    
    function showTurnstile() {
      els.spinner.classList.add('hidden');
      els.turnstileContainer.innerHTML = '';
      
      if (window.turnstile) {
        window.turnstile.render(els.turnstileContainer, {
          sitekey: TURNSTILE_SITE_KEY,
          theme: 'auto',
          size: 'normal',
          callback: onTurnstileSuccess,
          'error-callback': onTurnstileError,
          'expired-callback': onTurnstileExpired,
          'timeout-callback': onTurnstileTimeout
        });
      } else {
        setStatus(
          'Verification failed',
          'Unable to load security verification. Please refresh the page or check your internet connection.',
          'Error loading verification'
        );
      }
    }
    
    async function onTurnstileSuccess(token) {
      setStatus(
        'Verification successful',
        'Please wait while we redirect you to the requested page.',
        'Verifying token...'
      );
      
      try {
        const response = await fetch(VERIFY_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });
        
        const result = await response.json();
        
        if (result.success) {
          setStatus(
            'Redirecting...',
            'You will be redirected to the website shortly.',
            'Access granted'
          );
          
          document.cookie = 'cf_turnstile_verified=1; path=/; max-age=3600; SameSite=Strict';
          sessionStorage.setItem('turnstile_verified', Date.now().toString());
          
          setTimeout(() => {
            window.location.replace(TARGET_URL);
          }, 1500);
        } else {
          setStatus(
            'Verification failed',
            'The security verification could not be completed. Please try again.',
            'Invalid token'
          );
          showTurnstile();
        }
      } catch (err) {
        setStatus(
          'Connection error',
          'Unable to complete verification. Please check your connection and try again.',
          'Network error'
        );
        showTurnstile();
      }
    }
    
    function onTurnstileError() {
      setStatus(
        'Verification error',
        'An error occurred during verification. Please refresh the page and try again.',
        'Turnstile error'
      );
      showTurnstile();
    }
    
    function onTurnstileExpired() {
      setStatus(
        'Verification expired',
        'The verification has expired. Please complete the verification again.',
        'Token expired'
      );
      showTurnstile();
    }
    
    function onTurnstileTimeout() {
      setStatus(
        'Verification timeout',
        'The verification took too long. Please try again.',
        'Timeout'
      );
      showTurnstile();
    }
    
    // Init
    (function init() {
      // Cek apakah sudah verified
      const verified = sessionStorage.getItem('turnstile_verified');
      const cookieVerified = document.cookie.includes('cf_turnstile_verified');
      
      if (verified && cookieVerified) {
        const age = Date.now() - parseInt(verified);
        if (age < 3600000) {
          setStatus(
            'Redirecting...',
            'You have already been verified. Redirecting to the website...',
            'Session active'
          );
          setTimeout(() => window.location.replace(TARGET_URL), 1000);
          return;
        }
      }
      
      // Tampilkan Turnstile setelah delay
      setTimeout(() => {
        setStatus(
          'Performing security verification',
          'Please complete the verification below to continue.',
          'Waiting for user...'
        );
        showTurnstile();
      }, 2000);
    })();
  </script>
</body>
</html>
