  } catch (e) { /* mode privasi ketat: tampilkan halaman apa adanya */ }
</script>

<!--

   1. Navigasi header (toggle menu mobile, tahun footer) — kecil, inline

-->
<script>
(function () {
  'use strict';

  // Tahun di footer
  var elTahun = document.getElementById('year');
  if (elTahun) elTahun.textContent = String(new Date().getFullYear());

  // Toggle menu mobile
  var tombolNav = document.getElementById('navToggle');
  var nav = document.getElementById('siteNav');
  var scrim = document.getElementById('navScrim');

  if (tombolNav && nav) {
    tombolNav.addEventListener('click', function () {
      var terbuka = nav.classList.toggle('is-open');
      tombolNav.setAttribute('aria-expanded', terbuka ? 'true' : 'false');
      if (scrim) scrim.classList.toggle('is-open', terbuka);
    });

    if (scrim) {
      scrim.addEventListener('click', function () {
        nav.classList.remove('is-open');
        tombolNav.setAttribute('aria-expanded', 'false');
        scrim.classList.remove('is-open');
      });
    }
  }
})();
</script>
