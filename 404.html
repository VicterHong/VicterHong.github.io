<style>
  /* Halaman 404: sederhana, jelas, tetap dalam bahasa visual situs.
     Satu tugas — mengantar pengunjung kembali ke halaman yang ada. */
  .err {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem 1.5rem;
    gap: 0.5rem;
  }
  .err-code {
    font-family: 'JetBrains Mono', monospace;
    font-size: var(--fs-5);
    font-weight: 500;
    letter-spacing: -0.05em;
    color: var(--accent);
    margin: 0;
    line-height: 1;
  }
  .err h1 {
    font-size: var(--fs-4);
    letter-spacing: -0.03em;
    margin: 0.6rem 0 0;
    text-wrap: balance;
  }
  .err p {
    color: var(--text-dim);
    max-width: 46ch;
    margin: 0.6rem 0 1.6rem;
    text-wrap: pretty;
  }
  .err-links { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }

  /* ── IDENTITAS DI HALAMAN 404 ────────────────────────────────────────────
     Halaman ini sebelumnya hanya menampilkan "404" besar tanpa satu pun
     penanda pemilik situs. Pengunjung yang mendarat di sini karena tautan
     rusak adalah orang yang PALING perlu diyakinkan bahwa ia masih di situs
     yang benar — bukan di halaman error acak.

     Merek ditempatkan di atas, kecil, sebagai jangkar identitas. Ia tidak
     boleh bersaing dengan angka 404 yang justru informasi utamanya. */
  .err-merek {
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    margin-bottom: 1.75rem;
    color: var(--text);
    text-decoration: none;
  }
  .err-merek-mark {
    width: 26px;
    height: 26px;
    border-radius: var(--radius-ctl);
    background: var(--accent);
    flex-shrink: 0;
    display: grid;
    place-items: center;
  }
  .err-merek-teks {
    font-size: var(--fs-3);
    font-weight: 700;
    letter-spacing: 0.16em;
  }
  .err-merek:hover .err-merek-mark { filter: brightness(1.08); }
  .err-merek:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 4px;
    border-radius: 4px;
  }
</style>
</head>
<body>

    </span>
    <span class="err-merek-teks">VIVASTIC</span>
  </a>

  <p class="err-code">404</p>
  <h1>Halaman ini tidak ada</h1>
  <p>
    Mungkin tautannya salah ketik, atau halamannya sudah dipindahkan.
    Yang pasti: bukan Anda yang salah.
  </p>
  <div class="err-links">
    <a class="btn btn-primary" href="/">Kembali ke beranda</a>
    <a class="btn btn-ghost" href="/home#utqvwf">Lihat proyek</a>
  </div>
</main>
