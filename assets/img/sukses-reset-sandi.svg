<!--
  ══════════════════════════════════════════════════════════════════════════════
  ── ILUSTRASI SUKSES: SANDI BERHASIL DIGANTI ─────────────────────────────────
  ══════════════════════════════════════════════════════════════════════════════

  ── KENAPA ILUSTRASI, BUKAN HANYA CENTANG ───────────────────────────────────
  Centang sederhana (satu lingkaran + satu jalur) sudah benar secara fungsi,
  tapi ia tidak memberi rasa "selesai". Halaman korporat yang menangani momen
  penting — Stripe setelah pembayaran, Linear setelah deploy, Vercel setelah
  build — memakai ILUSTRASI, bukan ikon.

  Bedanya bukan sekadar lebih besar: ilustrasi punya KEDALAMAN (lapisan),
  RITME (elemen pendukung), dan WARNA (gradien). Ketiganya membuat momen
  terasa dirayakan, bukan hanya dikonfirmasi.

  ── YANG DIPAKAI DI SINI ────────────────────────────────────────────────────
  Tiga lapisan, dari luar ke dalam:

    1. CINCIN ATMOSFERIK — dua lingkaran konsentris dengan opasitas menurun.
       Fungsinya bukan hiasan: ia "memisahkan" ilustrasi dari latar kartu,
       memberi ruang napas di sekeliling badge. Tanpa ini, badge terlihat
       menempel di latar.

    2. BADGE — kotak membulat dengan gradien emas diagonal. Gradien diagonal
       (bukan horizontal) memberi kesan cahaya datang dari kiri atas — itu
       arah cahaya alami, dan mata membacanya sebagai benda tiga dimensi.

    3. CENTANG — jalur putih tebal di tengah badge. Putih, bukan emas: kontras
       maksimum terhadap badge emas, dan putih adalah warna "selesai" universal.

  ── KENAPA WARNA EMAS, BUKAN HIJAU ──────────────────────────────────────────
  Hijau adalah warna "sukses" yang lazim, tapi emas adalah warna brand
  VIVASTIC. Memakai hijau di sini akan terasa seperti komponen dari produk
  lain. Emas + putih tetap terbaca sebagai "berhasil" karena BENTUK centangnya
  yang menyampaikan pesan itu — warna hanya memperkuat.

  ── AKSESIBILITAS ───────────────────────────────────────────────────────────
  `aria-hidden="true"` — ilustrasi murni dekoratif. Pesan sebenarnya ada di
  teks di bawahnya ("Sandi berhasil diganti"), dan pembaca layar sudah
  membacakannya. Mendeskripsikan ilustrasi hanya akan mengulang.

  ── UKURAN ──────────────────────────────────────────────────────────────────
  viewBox 120×120, ditampilkan 96×96 di ponsel. Skalanya proporsional untuk
  kartu selebar 340px — cukup besar untuk terasa sebagai momen, cukup kecil
  untuk tidak mendorong teks keluar layar.
-->
<svg xmlns="http://www.w3.org/2000/svg" class="auth-sukses-ilustrasi"
     viewBox="0 0 120 120" width="96" height="96"
     role="img" aria-hidden="true" focusable="false">
  <defs>
    <!--
      Gradien badge: emas terang (kiri atas) → emas gelap (kanan bawah).

      Tiga berhenti, bukan dua: berhenti tengah di 45% membuat transisinya
      terasa lebih halus. Dengan dua berhenti, perubahan warnanya linear dan
      terlihat "datar" di bagian tengah.
    -->
    <linearGradient id="sukses-badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ffd970"/>
      <stop offset="45%"  stop-color="#f5c542"/>
      <stop offset="100%" stop-color="#d9a72e"/>
    </linearGradient>

    <!-- Kilau lembut di sudut kiri atas badge — memberi kesan permukaan. -->
    <radialGradient id="sukses-kilau" cx="0.28" cy="0.22" r="0.55">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!--
      Bayangan badge: bukan box-shadow (tidak bekerja di SVG), tapi elips
      gelap dengan blur. Diletakkan DI BELAKANG badge, sedikit ke bawah —
      meniru cahaya dari atas.
    -->
    <filter id="sukses-bayang" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4"/>
    </filter>
  </defs>

  <!-- ── LAPIS 1: CINCIN ATMOSFERIK ─────────────────────────────────────────── -->
  <!-- Cincin luar: paling redup, memberi batas terluar ruang ilustrasi. -->
  <circle cx="60" cy="60" r="56" fill="none"
          stroke="#f5c542" stroke-width="1.25" opacity="0.16"/>
  <!-- Cincin dalam: sedikit lebih terang, mengarahkan mata ke badge. -->
  <circle cx="60" cy="60" r="47" fill="none"
          stroke="#f5c542" stroke-width="1.25" opacity="0.28"/>

  <!-- ── LAPIS 2: BADGE ────────────────────────────────────────────────────── -->
  <!-- Bayangan di belakang badge. -->
  <ellipse cx="60" cy="72" rx="30" ry="9" fill="#000000" opacity="0.35"
           filter="url(#sukses-bayang)"/>

  <!-- Badge: kotak membulat 78×78 dengan sudut radius 22 (28% sisi).
       Radius 28% adalah proporsi yang dipakai ikon aplikasi iOS/macOS —
       terasa modern, tidak terlalu bulat seperti lingkaran. -->
  <rect x="21" y="21" width="78" height="78" rx="22"
        fill="url(#sukses-badge)"/>

  <!-- Kilau di atas badge. -->
  <rect x="21" y="21" width="78" height="78" rx="22"
        fill="url(#sukses-kilau)"/>

  <!-- ── LAPIS 3: CENTANG ──────────────────────────────────────────────────── -->
  <!--
    Jalur centang dengan tiga titik:
      mulai (44,61) → titik balik (54,71) → ujung (77,47)

    Panjangnya dibuat asimetris (lengan pendek, lengan panjang) — centang
    simetris terlihat seperti huruf V, bukan tanda centang.

    stroke-linecap="round" + stroke-linejoin="round": ujung dan sudutnya
    membulat, konsisten dengan badge yang juga membulat.
  -->
  <path d="M44 61 L54 71 L77 47" fill="none" stroke="#ffffff"
        stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"
        class="auth-sukses-centang"/>

  <!-- ── AKSEN: DUA TITIK KECIL ────────────────────────────────────────────── -->
  <!--
    Dua titik kecil di luar badge — satu kanan atas, satu kiri bawah.

    Fungsinya mengisi ruang kosong di dalam cincin agar komposisinya tidak
    terasa "badge mengambang di tengah kekosongan". Ukurannya sengaja kecil
    (radius 3 dan 2) supaya terbaca sebagai percikan, bukan elemen kedua.
  -->
  <circle cx="98" cy="30" r="3" fill="#f5c542" opacity="0.55"
          class="auth-sukses-titik auth-sukses-titik-1"/>
  <circle cx="23" cy="92" r="2" fill="#f5c542" opacity="0.40"
          class="auth-sukses-titik auth-sukses-titik-2"/>
</svg>
